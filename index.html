<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Maclina · Diseñadora gráfica</title>
  <meta name="description" content="Portfolio de Laura Maclina, diseñadora gráfica multidisciplinar. Branding, campañas y cartelería con carácter y personalidad.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ======= CONFIG RÁPIDA: cambia estos datos en config.js ======= -->
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html" data-brand>Laura Maclina</a>
      <nav class="nav-links" id="menu">
        <a href="#trabajos">Trabajos</a>
        <a href="#sobre">Sobre mí</a>
        <a href="#contacto">Contacto</a>
      </nav>
      <a class="btn" data-email href="#">Hablemos</a>
      <button class="nav-toggle" aria-label="Menú" onclick="document.getElementById('menu').classList.toggle('show')">☰</button>
    </div>
  </header>

  <!-- ======= HERO ======= -->
  <div class="wrap hero">
    <img class="hero-photo" data-hero-photo src="assets/laura.jpg" alt="Laura Maclina">
    <div class="hero-grid">
      <div>
        <div class="pill"><span class="dot"></span><span data-status>Disponible para nuevos proyectos</span></div>
        <h1 class="hero-title" data-headline></h1>
      </div>
      <div>
        <p class="hero-bio" data-bio></p>
        <a class="btn" data-email href="#">Escríbeme</a>
      </div>
    </div>
  </div>

  <!-- ======= TRABAJOS ======= -->
  <section id="trabajos" class="wrap">
    <div class="sec-head">
      <h2>Trabajos destacados</h2>
    </div>
    <div class="works" id="works"></div>
  </section>

  <!-- ======= SOBRE MÍ ======= -->
  <section id="sobre" class="wrap">
    <div class="sec-head">
      <h2>Sobre mí</h2>
    </div>
    <div class="about">
      <div>
        <p data-about-1></p>
        <p data-about-2></p>
      </div>
      <div>
        <p class="skills-title">Skills</p>
        <div class="taglist" data-skills></div>
        <p class="skills-title">Software</p>
        <div class="soft" data-software></div>
      </div>
    </div>
  </section>

  <!-- ======= CTA / CONTACTO ======= -->
  <section id="contacto" class="wrap" style="padding-bottom:0">
    <div class="cta">
      <h2 data-cta-title></h2>
      <p data-cta-sub></p>
      <a class="btn" data-email href="#">Escríbeme</a>
    </div>
    <footer class="site-footer">
      <span>© <span data-year></span> <span data-brand></span></span>
      <span>
        <a data-behance href="#" target="_blank" rel="noopener">Behance</a> ·
        <a data-linkedin href="#" target="_blank" rel="noopener">LinkedIn</a> ·
        <a data-email href="#">Email</a>
      </span>
    </footer>
  </section>

  <script src="js/config.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
